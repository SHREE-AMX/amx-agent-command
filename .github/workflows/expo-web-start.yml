name: Start Expo Web

on:
  workflow_dispatch:
    inputs:
      port:
        description: 'Port to run Expo on'
        required: false
        default: '8081'
        type: string
      tunnel:
        description: 'Use Expo tunnel for public URL'
        required: false
        default: 'true'
        type: boolean

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Align Expo SDK
        run: npx expo install --fix

      - name: Start Expo web server (with tunnel)
        env:
          EXPO_PORT: ${{ inputs.port }}
          EXPO_USE_TUNNEL: ${{ inputs.tunnel }}
        run: |
          npx expo start --web \
            --port $EXPO_PORT \
            $([ "$EXPO_USE_TUNNEL" = "true" ] && echo "--tunnel") \
            --non-interactive
